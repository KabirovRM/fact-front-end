# fact-frontend/.gitlab-ci.yml
# Сборка кастомного образа на Gitverse (VK Cloud)

image: gcr.io/kaniko-project/executor:debug

variables:
  # === Registry Gitverse (VK Cloud) ===
  GITVERSE_REGISTRY: "registry.gitverse.ru"
  GITVERSE_PROJECT: "kabirovrm/fact-frontend"
  TAG_LATEST: "${GITVERSE_REGISTRY}/${GITVERSE_PROJECT}:latest"
  TAG_REF: "${GITVERSE_REGISTRY}/${GITVERSE_PROJECT}:${CI_COMMIT_REF_NAME}"
  TAG_SHA: "${GITVERSE_REGISTRY}/${GITVERSE_PROJECT}:${CI_COMMIT_SHORT_SHA}"

  # === NPM private registry ===
  NPM_REGISTRY: "repo.fact.digital"
  NPM_REGISTRY_USER: "${NPM_REGISTRY_USER}"
  NPM_REGISTRY_PASSWORD: "${NPM_REGISTRY_PASSWORD}"

stages:
  - build
  - push-tags

# === Сборка образа для develop ===
build-develop:
  stage: build
  before_script:
    - mkdir -p /kaniko/.docker
    # Логин для push в Gitverse
    - echo "{\"auths\":{\"${GITVERSE_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${GIT_TOKEN_USER}" "${GIT_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    # Создаём .npmrc для доступа к приватным пакетам
    - |
      cat > .npmrc <<NPMEOF
      @private:registry=https://${NPM_REGISTRY}/repository/npm-customize/
      //${NPM_REGISTRY}/repository/npm-customize/:_auth=$(printf "%s:%s" "${NPM_REGISTRY_USER}" "${NPM_REGISTRY_PASSWORD}" | base64)
      NPMEOF
  script:
    - /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile $CI_PROJECT_DIR/Dockerfile \
        --destination ${TAG_LATEST} \
        --destination ${TAG_REF} \
        --destination ${TAG_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    KUBERNETES_SERVICE_MEMORY_REQUEST: "4Gi"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "4Gi"

# === Сборка образа для release-веток ===
build-release:
  stage: build
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${GITVERSE_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${GIT_TOKEN_USER}" "${GIT_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      cat > .npmrc <<NPMEOF
      @private:registry=https://${NPM_REGISTRY}/repository/npm-customize/
      //${NPM_REGISTRY}/repository/npm-customize/:_auth=$(printf "%s:%s" "${NPM_REGISTRY_USER}" "${NPM_REGISTRY_PASSWORD}" | base64)
      NPMEOF
  script:
    - /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile $CI_PROJECT_DIR/Dockerfile \
        --destination ${TAG_REF} \
        --destination ${TAG_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^v[0-9]+\.[0-9]+/
  variables:
    KUBERNETES_SERVICE_MEMORY_REQUEST: "4Gi"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "4Gi"

# === Автоматическая тегация develop → latest ===
tag-develop-latest:
  stage: push-tags
  image: alpine/helm:latest
  before_script:
    - apk add --no-cache docker-cli
  script:
    - docker pull ${TAG_REF}
    - docker tag ${TAG_REF} ${TAG_LATEST}
    - docker push ${TAG_LATEST}
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
